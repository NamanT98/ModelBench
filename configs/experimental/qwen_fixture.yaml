# Qwen 2.5 Coder 3B fixture evaluation config
#
# Usage:
#   modelbench evaluate-model --config configs/qwen_fixture.yaml
#
# Requirements:
#   pip install 'modelbench[inference]'
#   A GPU with >= 6 GB VRAM is recommended (auto falls back to CPU).

project_name: modelbench
log_level: INFO

model:
  provider: huggingface
  model_id: Qwen/Qwen2.5-Coder-3B-Instruct
  revision: main
  device: auto
  dtype: auto

generation:
  max_new_tokens: 256
  temperature: 0.0
  do_sample: false
