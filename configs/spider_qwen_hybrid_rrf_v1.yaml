experiment:
  name: spider_qwen_hybrid_rrf_v1
dataset:
  name: spider
  path: datasets/spider
  split: dev
  limit: null
model:
  provider: huggingface
  model_id: Qwen/Qwen2.5-Coder-3B-Instruct
generation:
  max_new_tokens: 256
  temperature: 0.0
  batch_size: 8
schema:
  strategy: schema_linking_normalized
strategy:
  name: few_shot
  retriever: hybrid_rrf
  hybrid_rrf_constant: 60
  hybrid_candidate_n: 25
  embedding_model: BAAI/bge-small-en-v1.5
  k: 3
